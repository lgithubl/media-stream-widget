[package]
name = "media-stream-widget"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1.12"
futures-util = "0.3"
http-body-util = "0.1"
libc = "0.2"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
